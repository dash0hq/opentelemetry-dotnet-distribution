name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for the release, e.g. 0.1.0 or 0.1.0-rc.1 (leading v optional)"
        required: true
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to pin"
        required: true
        default: dash0-main

permissions:
  contents: read

jobs:
  prepare-release:
    name: Open release PR
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A non-default token so the branch push and PR creation happen as
          # a principal whose actions can trigger downstream workflows.
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - name: Normalize inputs
        id: inputs
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].]+)?$ ]]; then
            echo "::error::version must be semver (e.g. 0.1.0 or 0.1.0-rc.1)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "branch=prepare-release/v${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream SHA
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/dash0hq/opentelemetry-dotnet-instrumentation/commits/${{ inputs.upstream_ref }}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.upstream_ref }} -> ${sha}"

      - name: Reject duplicate tag
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists on ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Update .upstream-ref
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SHA}" > .upstream-ref

      - name: Commit and push
        env:
          BRANCH: ${{ steps.inputs.outputs.branch }}
          TAG: ${{ steps.inputs.outputs.tag }}
          SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          # Use a stable non-personal identity for the release commit so the
          # matcher in create-tag-for-release.yml can identify it reliably.
          git config user.name "dash0-releasebot"
          git config user.email "dash0-releasebot@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .upstream-ref
          if git diff --cached --quiet; then
            echo "::error::.upstream-ref did not change; refusing to open an empty release PR"
            exit 1
          fi
          git commit -m "chore: prepare release ${TAG}"$'\n\n'"Pins upstream to ${UPSTREAM_REF} @ ${SHA}."
          git push --set-upstream origin "${BRANCH}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          BRANCH: ${{ steps.inputs.outputs.branch }}
          TAG: ${{ steps.inputs.outputs.tag }}
          SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          gh pr create \
            --head "${BRANCH}" \
            --base main \
            --title "chore: prepare release ${TAG}" \
            --body "$(cat <<EOF
          Prepares release **${TAG}**.

          - Upstream ref: \`${UPSTREAM_REF}\`
          - Upstream commit: [\`${SHA}\`](https://github.com/dash0hq/opentelemetry-dotnet-instrumentation/commit/${SHA})

          On merge, [\`create-tag-for-release\`](../actions/workflows/create-tag-for-release.yml) will push tag \`${TAG}\`, which triggers [\`release\`](../actions/workflows/release.yml) to build and publish the tarballs.
          EOF
          )"
