name: release

on:
  # Tag-triggered runs are the normal path: prepare-release opens a PR, the
  # merge is auto-tagged by create-tag-for-release, and that tag lands here.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual override for hotfixes or debugging. Prefer the tag flow.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        default: dash0-main
      release_tag:
        description: "Tag to create for this release (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/upstream/packages

jobs:
  resolve-upstream:
    name: Resolve upstream ref
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve upstream SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag-triggered: read the pinned SHA that prepare-release committed.
            if [ ! -f .upstream-ref ]; then
              echo "::error::.upstream-ref missing from ${GITHUB_REF_NAME}. Was the tag created outside prepare-release?"
              exit 1
            fi
            sha=$(tr -d ' \t\r\n' < .upstream-ref)
            release_tag="${GITHUB_REF_NAME}"
            # RC tags publish as drafts; stable tags publish immediately.
            if [[ "${release_tag}" == *-rc.* ]]; then
              draft=true
            else
              draft=false
            fi
          else
            # workflow_dispatch: resolve the ref the caller supplied.
            sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${{ inputs.upstream_ref }}" --jq .sha)
            release_tag="${{ inputs.release_tag }}"
            draft="${{ inputs.draft }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream=${sha}, release_tag=${release_tag}, draft=${draft}"

  build-native-x64:
    name: Build native x64 (ubuntu 16.04 container)
    needs: resolve-upstream
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch ubuntu1604.dockerfile
        run: |
          set -euo pipefail
          # 1. Strip the stale SHA check for dotnet-install.sh — upstream pins
          #    a SHA that no longer matches Microsoft's current script. TLS
          #    from dot.net covers transport integrity.
          sed -i '/sha256sum -c/d' ./docker/ubuntu1604.dockerfile
          # 2. Fix the kitware cmake repo signed-by mismatch. The RUN writes
          #    the kitware GPG key to /etc/apt/trusted.gpg.d/kitware.gpg but
          #    the sources.list restricts trust to a non-existent
          #    /usr/share/keyrings/kitware-archive-keyring.gpg. Result: apt
          #    can't verify the kitware repo, silently keeps Ubuntu 16.04's
          #    cmake 3.5.1, and the tracer's CMakeLists (requires >=3.10)
          #    fails. Switch that restriction to [trusted=yes]; the key is
          #    already trusted globally via /etc/apt/trusted.gpg.d/.
          sed -i 's|signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg|trusted=yes|' ./docker/ubuntu1604.dockerfile
          # 3. Refresh CA bundle. Xenial's ca-certificates is too old to
          #    trust some modern TLS certs; keep this so all HTTPS-using
          #    RUNs (kitware, dot.net, etc.) have a modern trust store.
          curl -fsSL https://curl.se/ca/cacert.pem -o ./docker/cacert.pem
          sed -i 's|    libicu-dev$|    libicu-dev\n\n# CA-bundle refresh (workflow patch)\nCOPY docker/cacert.pem /etc/ssl/certs/ca-certificates.crt|' ./docker/ubuntu1604.dockerfile
          # 4. Bypass `add-apt-repository ppa:ubuntu-toolchain-r/test`. That
          #    command calls api.launchpad.net at build time and is
          #    intermittently flaky from GitHub-Actions IP ranges even with
          #    a fresh CA bundle (9-minute TLS timeouts then a nonsense
          #    "user or team does not exist" error). Write the deb source
          #    line directly with [trusted=yes]; apt then pulls g++-9 from
          #    ppa.launchpad.net over HTTP with no cert or API round-trip.
          sed -i 's|RUN add-apt-repository ppa:ubuntu-toolchain-r/test -y|RUN echo "deb [trusted=yes] http://ppa.launchpad.net/ubuntu-toolchain-r/test/ubuntu xenial main" > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list|' ./docker/ubuntu1604.dockerfile
          # 4. Override cmake with a modern static build from Kitware's GitHub
          #    releases. Xenial ships cmake 3.5.1; the kitware apt repo for
          #    xenial no longer publishes a newer cmake, so upstream's
          #    kitware-apt install silently keeps 3.5.1 — below the tracer's
          #    cmake >= 3.10 requirement. Extract the static tarball into
          #    /usr/local and symlink into /usr/bin so Nuke (which calls
          #    /usr/bin/cmake explicitly) picks it up.
          awk '/^    apt-get install -y --allow-unauthenticated cmake$/ {
            print
            print ""
            print "# Override cmake with static Linux build from Kitware GitHub (workflow patch)"
            print "RUN curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.29.9/cmake-3.29.9-linux-x86_64.tar.gz \\"
            print "    | tar -xz -C /usr/local --strip-components=1 \\"
            print "    && ln -sf /usr/local/bin/cmake /usr/bin/cmake \\"
            print "    && cmake --version"
            next
          }
          { print }' ./docker/ubuntu1604.dockerfile > ./docker/ubuntu1604.dockerfile.patched
          mv ./docker/ubuntu1604.dockerfile.patched ./docker/ubuntu1604.dockerfile
          echo "--- patched ubuntu1604.dockerfile ---"
          cat ./docker/ubuntu1604.dockerfile

      - name: Build native library in Ubuntu 16.04 container
        run: |
          set -euo pipefail
          docker build -t dash0-native-build -f ./docker/ubuntu1604.dockerfile .
          docker run -e OS_TYPE=linux-glibc --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-native-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildNativeWorkflow'

      - name: Upload native x64 artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-linux-x64
          path: bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so
          if-no-files-found: error
          retention-days: 7

  build-x64:
    name: Build linux-x64 tracer-home
    needs: [resolve-upstream, build-native-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200

      - name: Build tracer-home
        # Skip the standalone Restore target; it restores the whole solution,
        # including test-applications that pin NServiceBus 9.2.6 (net8-only),
        # which fails on the multi-TFM restore. BuildTracer restores only the
        # projects it depends on.
        run: ./build.sh BuildTracer

      - name: Download native x64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-x64
          path: native-x64

      - name: Swap in ubuntu-16.04-built native library
        run: |
          set -euo pipefail
          src="native-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          dst="./bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
          test -f "$dst"
          rm "$dst"
          cp "$src" "$dst"
          file "$dst"

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz"
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-x64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-native-arm64:
    name: Build native arm64 (ubuntu 16.04 container)
    needs: resolve-upstream
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch ubuntu1604.dockerfile for arm64
        run: |
          set -euo pipefail
          # Same patches as the x64 native build, plus three arm64-specific
          # adjustments: switch the base to arm64v8/ubuntu:16.04 (the pinned
          # amd64 digest does not resolve on an arm64 host), drop the
          # apt.llvm.org clang-5.0 install (that repo has no arm64 packages
          # and the build actually uses gcc-9 anyway), and use the aarch64
          # cmake tarball.

          # Base image: arm64 variant (drop the amd64 digest pin)
          sed -i 's|^FROM ubuntu:16.04@sha256:[0-9a-f]*|FROM arm64v8/ubuntu:16.04|' ./docker/ubuntu1604.dockerfile

          # Stale dotnet-install.sh SHA
          sed -i '/sha256sum -c/d' ./docker/ubuntu1604.dockerfile

          # kitware signed-by → trusted=yes (kitware apt install is vestigial
          # after the tarball override below, but keep the fix so apt-get
          # update doesn't emit a hard error)
          sed -i 's|signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg|trusted=yes|' ./docker/ubuntu1604.dockerfile

          # CA-bundle refresh
          curl -fsSL https://curl.se/ca/cacert.pem -o ./docker/cacert.pem
          sed -i 's|    libicu-dev$|    libicu-dev\n\n# CA-bundle refresh (workflow patch)\nCOPY docker/cacert.pem /etc/ssl/certs/ca-certificates.crt|' ./docker/ubuntu1604.dockerfile

          # Bypass `add-apt-repository ppa:ubuntu-toolchain-r/test` — the
          # Launchpad API call is intermittently flaky from GitHub-Actions
          # IP ranges; write the deb source line directly with [trusted=yes]
          # so apt fetches g++-9 straight from ppa.launchpad.net.
          sed -i 's|RUN add-apt-repository ppa:ubuntu-toolchain-r/test -y|RUN echo "deb [trusted=yes] http://ppa.launchpad.net/ubuntu-toolchain-r/test/ubuntu xenial main" > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list|' ./docker/ubuntu1604.dockerfile

          # Replace the clang install. apt.llvm.org/xenial has no arm64
          # packages, and Ubuntu 16.04 xenial arm64 only ships clang <= 3.9
          # (insufficient for the tracer's -std=c++17). Install LLVM 8.0.1's
          # prebuilt aarch64 tarball instead. The tracer's CMakeLists
          # locates clang/clang++ via find_program and uses them as
          # CMAKE_C_COMPILER / CMAKE_CXX_COMPILER.
          #
          # LLVM 8's clang binary requires GLIBCXX_3.4.22 (from GCC 5.3+
          # libstdc++), which Ubuntu 16.04's default libstdc++ predates.
          # The dockerfile installs g++-9 from ubuntu-toolchain-r/test,
          # which pulls a newer libstdc++6 satisfying that requirement, so
          # LLVM is installed AFTER the g++-9 block, not before.
          sed -i '/^# Install newer clang$/,/update-alternatives --config clang++$/d' ./docker/ubuntu1604.dockerfile
          awk '/update-alternatives --install \/usr\/bin\/gcc gcc \/usr\/bin\/gcc-9/ {
            print
            print ""
            print "# Install clang from LLVM GitHub releases (workflow patch for arm64)"
            print "RUN mkdir -p /opt/llvm \\"
            print "    && curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-8.0.1/clang+llvm-8.0.1-aarch64-linux-gnu.tar.xz \\"
            print "    | tar -xJ -C /opt/llvm --strip-components=1 \\"
            print "    && ln -sf /opt/llvm/bin/clang /usr/bin/clang \\"
            print "    && ln -sf /opt/llvm/bin/clang++ /usr/bin/clang++ \\"
            print "    && clang --version"
            next
          }
          { print }' ./docker/ubuntu1604.dockerfile > ./docker/ubuntu1604.dockerfile.patched
          mv ./docker/ubuntu1604.dockerfile.patched ./docker/ubuntu1604.dockerfile

          # cmake arch fix — the base dockerfile's cmake install RUN block
          # hardcodes the x86_64 installer regardless of target arch. On the
          # arm64 build that silently installs an x86_64 cmake binary into
          # /usr/local/bin, which then fails at runtime with "Exec format
          # error". Swap the installer filename for the aarch64 build. (Its
          # sha256sum check line is already stripped above, along with the
          # dotnet-install.sh one, since both match /sha256sum -c/.)
          sed -i 's|cmake-${CMAKE_VERSION}-linux-x86_64.sh|cmake-${CMAKE_VERSION}-linux-aarch64.sh|' ./docker/ubuntu1604.dockerfile
          echo "--- patched ubuntu1604.dockerfile (arm64) ---"
          cat ./docker/ubuntu1604.dockerfile

      - name: Build native library in Ubuntu 16.04 container
        run: |
          set -euo pipefail
          docker build -t dash0-native-build -f ./docker/ubuntu1604.dockerfile .
          docker run -e OS_TYPE=linux-glibc --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-native-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildNativeWorkflow'

      - name: Upload native arm64 artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-linux-arm64
          path: bin/tracer-home/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    name: Build linux-arm64 tracer-home
    needs: [resolve-upstream, build-native-arm64]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200

      - name: Build tracer-home
        run: ./build.sh BuildTracer

      - name: Download native arm64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-arm64
          path: native-arm64

      - name: Swap in ubuntu-16.04-built native library
        run: |
          set -euo pipefail
          src="native-arm64/OpenTelemetry.AutoInstrumentation.Native.so"
          dst="./bin/tracer-home/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
          test -f "$dst"
          rm "$dst"
          cp "$src" "$dst"
          file "$dst"

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz"
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-arm64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-musl:
    name: Build linux-musl-${{ matrix.arch }} tracer-home (alpine container)
    needs: resolve-upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch alpine.dockerfile
        run: |
          set -euo pipefail
          # 1. Strip the stale SHA check for dotnet-install.sh (same issue as
          #    ubuntu1604.dockerfile — Microsoft rotated the script). No-op
          #    now that dotnet-install.sh is vendored via COPY instead of
          #    curled, but harmless to keep in case that regresses.
          sed -i '/sha256sum -c/d' ./docker/alpine.dockerfile
          # Previously stripped apk exact-version pins here (e.g.
          # clang=17.0.6-r1) because Alpine 3.20's apk repos drifted past
          # them. Dropped: upstream's Dockerfile now declares those versions
          # as ARG ... =X.Y.Z-rN defaults consumed via clang21="${VAR}", and
          # the same blind regex was stripping the ARG defaults themselves,
          # leaving e.g. clang21="" and failing apk with "not a valid world
          # dependency".
          echo "--- patched alpine.dockerfile ---"
          cat ./docker/alpine.dockerfile

      - name: Build tracer-home in alpine container
        run: |
          set -euo pipefail
          docker build -t dash0-alpine-build -f ./docker/alpine.dockerfile .
          docker run -e OS_TYPE=linux-musl --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-alpine-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildTracer'

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-musl-${{ matrix.arch }}.tar.gz"
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-musl-${{ matrix.arch }}
          path: dash0-opentelemetry-dotnet-instrumentation-linux-musl-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E tests (${{ matrix.arch }})
    # Release-gate mode from test/e2e/README.md: validate the exact
    # glibc tarball this pipeline just built, not a from-source rebuild.
    # Only glibc x64/arm64 are covered, not the musl variants -- the E2E
    # scenarios don't depend on libc flavor, so this is enough to gate on.
    needs: [build-x64, build-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release-linux-${{ matrix.arch }} tracer-home
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-${{ matrix.arch }}

      - name: Extract tracer-home
        run: |
          set -euo pipefail
          mkdir -p tracer-home
          tar -C tracer-home -xzf "dash0-opentelemetry-dotnet-instrumentation-linux-${{ matrix.arch }}.tar.gz"
          echo "DASH0_E2E_TRACER_HOME=${GITHUB_WORKSPACE}/tracer-home" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/e2e/go.mod

      - name: Run E2E tests
        working-directory: test/e2e
        # efcore/efcorenet8 are t.Skip()-ed: a real, root-caused upstream
        # bug (see their package docs and README.md's "Known failure:
        # efcore" section), not something this run could catch or fix.
        run: go test -v ./...

  release:
    name: Publish GitHub Release
    needs: [resolve-upstream, build-x64, build-arm64, build-musl, e2e]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download glibc x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Download glibc arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-arm64

      - name: Download musl x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-x64

      - name: Download musl arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-arm64

      - name: Write release notes
        env:
          SHA: ${{ needs.resolve-upstream.outputs.sha }}
        run: |
          cat > release-notes.md <<EOF
          Dash0 build of [\`${{ env.UPSTREAM_REPO }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${SHA}) at commit \`${SHA}\`.

          ## Assets

          - \`dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz\` — Linux x86_64, glibc ≥ 2.23 (native code built on Ubuntu 16.04).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz\` — Linux aarch64, glibc ≥ 2.23 (native code built on Ubuntu 16.04 arm64).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz\` — Linux x86_64 musl (built on Alpine 3.20). For Alpine-based .NET images.
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz\` — Linux aarch64 musl (built on Alpine 3.20). For Alpine-based .NET images.

          Each archive extracts to the upstream \`bin/tracer-home\` layout (\`net/\`, \`AdditionalDeps/\`, \`linux-<arch>/\` or \`linux-musl-<arch>/\`, plus \`instrument.sh\` and legal files). Point \`OTEL_DOTNET_AUTO_HOME\` at the extracted directory. See the [README](https://github.com/${{ github.repository }}#consuming-a-release) for setup.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-upstream.outputs.release_tag }}
          DRAFT: ${{ needs.resolve-upstream.outputs.draft }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRAFT}" = "true" ]; then
            args+=(--draft)
          fi
          # For tag-triggered runs, the tag already exists; --verify-tag makes
          # gh use it. For workflow_dispatch, --target points at the current
          # SHA and gh creates the tag.
          if [ "${{ github.event_name }}" = "push" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${args[@]}" \
            dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz
