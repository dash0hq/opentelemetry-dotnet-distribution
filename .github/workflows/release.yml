name: release

on:
  # Tag-triggered runs are the normal path: prepare-release opens a PR, the
  # merge is auto-tagged by create-tag-for-release, and that tag lands here.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual override for hotfixes or debugging. Prefer the tag flow.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        default: dash0-main
      release_tag:
        description: "Tag to create for this release (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/upstream/packages

jobs:
  resolve-upstream:
    name: Resolve upstream ref
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve upstream SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag-triggered: read the pinned SHA that prepare-release committed.
            if [ ! -f .upstream-ref ]; then
              echo "::error::.upstream-ref missing from ${GITHUB_REF_NAME}. Was the tag created outside prepare-release?"
              exit 1
            fi
            sha=$(tr -d ' \t\r\n' < .upstream-ref)
            release_tag="${GITHUB_REF_NAME}"
            # RC tags publish as drafts; stable tags publish immediately.
            if [[ "${release_tag}" == *-rc.* ]]; then
              draft=true
            else
              draft=false
            fi
          else
            # workflow_dispatch: resolve the ref the caller supplied.
            sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${{ inputs.upstream_ref }}" --jq .sha)
            release_tag="${{ inputs.release_tag }}"
            draft="${{ inputs.draft }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream=${sha}, release_tag=${release_tag}, draft=${draft}"

  build-and-e2e:
    name: Build glibc tracer-homes and run E2E gate
    needs: resolve-upstream
    uses: ./.github/workflows/build-and-e2e.yml
    with:
      upstream_sha: ${{ needs.resolve-upstream.outputs.sha }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: [resolve-upstream, build-and-e2e]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download glibc x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Download glibc arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-arm64

      - name: Download musl x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-x64

      - name: Download musl arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-arm64

      - name: Resolve OTel SDK/instrumentation versions for release notes
        id: otel-versions
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          SHA: ${{ needs.resolve-upstream.outputs.sha }}
        run: |
          set -euo pipefail
          sdk_version=$(gh api "repos/${UPSTREAM_REPO}/contents/Directory.Packages.props?ref=${SHA}" --jq '.content' \
            | base64 -d \
            | grep -oP '(?<=<PackageVersion Include="OpenTelemetry" Version=")[^"]+')
          if [ -z "${sdk_version}" ]; then
            echo "::error::could not find the OpenTelemetry package version in Directory.Packages.props"
            exit 1
          fi
          echo "sdk_version=${sdk_version}" >> "$GITHUB_OUTPUT"

          # CHANGELOG.md's first versioned heading below "## [Unreleased]" is
          # the last official opentelemetry-dotnet-instrumentation release
          # this build sits on top of. Best-effort: if the format ever
          # changes, just omit this line from the notes rather than fail the
          # release over it.
          base_release=$(gh api "repos/${UPSTREAM_REPO}/contents/CHANGELOG.md?ref=${SHA}" --jq '.content' \
            | base64 -d \
            | grep -m1 -oP '(?<=^## \[)v[0-9]+\.[0-9]+\.[0-9]+(?=\])' || true)
          echo "base_release=${base_release}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          SHA: ${{ needs.resolve-upstream.outputs.sha }}
          OTEL_SDK_VERSION: ${{ steps.otel-versions.outputs.sdk_version }}
          OTEL_BASE_RELEASE: ${{ steps.otel-versions.outputs.base_release }}
        run: |
          set -euo pipefail
          otel_line="Targets [OpenTelemetry SDK/API \`${OTEL_SDK_VERSION}\`](https://github.com/open-telemetry/opentelemetry-dotnet/releases/tag/core-${OTEL_SDK_VERSION})."
          if [ -n "${OTEL_BASE_RELEASE}" ]; then
            otel_line="${otel_line} Based on [opentelemetry-dotnet-instrumentation \`${OTEL_BASE_RELEASE}\`](https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/tag/${OTEL_BASE_RELEASE})."
          fi
          cat > release-notes.md <<EOF
          Dash0 build of [\`${{ env.UPSTREAM_REPO }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${SHA}) at commit \`${SHA}\`.

          ${otel_line}

          ## Assets

          - \`dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz\` — Linux x86_64, glibc ≥ 2.23 (native code built on Ubuntu 16.04).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz\` — Linux aarch64, glibc ≥ 2.23 (native code built on Ubuntu 16.04 arm64).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz\` — Linux x86_64 musl (built on Alpine 3.20). For Alpine-based .NET images.
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz\` — Linux aarch64 musl (built on Alpine 3.20). For Alpine-based .NET images.

          Each archive extracts to the upstream \`bin/tracer-home\` layout (\`net/\`, \`AdditionalDeps/\`, \`linux-<arch>/\` or \`linux-musl-<arch>/\`, plus \`instrument.sh\` and legal files). Point \`OTEL_DOTNET_AUTO_HOME\` at the extracted directory. See the [README](https://github.com/${{ github.repository }}#consuming-a-release) for setup.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-upstream.outputs.release_tag }}
          DRAFT: ${{ needs.resolve-upstream.outputs.draft }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRAFT}" = "true" ]; then
            args+=(--draft)
          fi
          # For tag-triggered runs, the tag already exists; --verify-tag makes
          # gh use it. For workflow_dispatch, --target points at the current
          # SHA and gh creates the tag.
          if [ "${{ github.event_name }}" = "push" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${args[@]}" \
            dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz
