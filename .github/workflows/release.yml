name: release

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        default: dash0-main
      release_tag:
        description: "Tag to create for this release (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  resolve-upstream:
    name: Resolve upstream ref
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve upstream SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${{ inputs.upstream_ref }}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.upstream_ref }} -> ${sha}"

  build:
    name: Build linux-${{ matrix.arch }} tracer-home
    needs: resolve-upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200

      - name: Build tracer-home
        # Use BuildTracer (not BuildWorkflow) to skip the standalone Restore
        # target. Restore pulls the whole solution, including test-applications
        # that pin NServiceBus 9.2.6 (net8-only) and fail multi-TFM restore.
        # BuildTracer restores only the src projects it depends on.
        run: ./build.sh BuildTracer

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-${{ matrix.arch }}.tar.gz"
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dash0-opentelemetry-dotnet-instrumentation-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [resolve-upstream, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Download arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-arm64

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Dash0 build of \`${{ env.UPSTREAM_REPO }}\` at ref \`${{ inputs.upstream_ref }}\` (\`${{ needs.resolve-upstream.outputs.sha }}\`).

          ## Assets

          - \`dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz\` — Linux x86_64, glibc ≥ 2.35 (built on Ubuntu 22.04).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz\` — Linux aarch64, glibc ≥ 2.35 (built on Ubuntu 22.04 arm64).

          Each archive extracts to a tracer-home layout: \`net/\`, \`AdditionalDeps/\`, \`linux-<arch>/\`, plus \`instrument.sh\` and legal files. Point \`OTEL_DOTNET_AUTO_HOME\` at the extracted directory.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "${{ inputs.release_tag }}" \
            --title "${{ inputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            "${args[@]}" \
            dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz
