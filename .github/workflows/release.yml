name: release

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        default: dash0-main
      release_tag:
        description: "Tag to create for this release (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/upstream/packages

jobs:
  resolve-upstream:
    name: Resolve upstream ref
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve upstream SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${{ inputs.upstream_ref }}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.upstream_ref }} -> ${sha}"

  build-native-x64:
    name: Build native x64 (ubuntu 16.04 container)
    needs: resolve-upstream
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build native library in Ubuntu 16.04 container
        run: |
          set -euo pipefail
          docker build -t dash0-native-build -f ./docker/ubuntu1604.dockerfile ./docker
          docker run -e OS_TYPE=linux-glibc --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-native-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildNativeWorkflow'

      - name: Upload native x64 artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-linux-x64
          path: bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so
          if-no-files-found: error
          retention-days: 7

  build-x64:
    name: Build linux-x64 tracer-home
    needs: [resolve-upstream, build-native-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200

      - name: Restore NuGet packages
        run: ./build.sh Restore

      - name: Run BuildWorkflow
        run: ./build.sh BuildWorkflow --no-restore true

      - name: Download native x64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-x64
          path: native-x64

      - name: Swap in ubuntu-16.04-built native library
        run: |
          set -euo pipefail
          src="native-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          dst="./bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
          test -f "$dst"
          rm "$dst"
          cp "$src" "$dst"
          file "$dst"

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz"
          # Include net, netfx, linux-x64 and installation-scripts; drop other RIDs to keep the archive lean.
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" \
            net netfx linux-x64
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-x64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    name: Build linux-arm64 tracer-home
    needs: resolve-upstream
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200

      - name: Restore NuGet packages
        run: ./build.sh Restore

      - name: Run BuildWorkflow
        run: ./build.sh BuildWorkflow --no-restore true

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz"
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" \
            net netfx linux-arm64
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-arm64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [resolve-upstream, build-x64, build-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Download arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-arm64

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Dash0 build of \`${{ env.UPSTREAM_REPO }}\` at ref \`${{ inputs.upstream_ref }}\` (\`${{ needs.resolve-upstream.outputs.sha }}\`).

          ## Assets

          - \`dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz\` — Linux x86_64 (glibc ≥ 2.23, native code built on Ubuntu 16.04).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz\` — Linux aarch64 (glibc ≥ 2.35, native code built on Ubuntu 22.04 arm64).

          Each archive extracts to a tracer-home layout with \`net/\`, \`netfx/\`, and the per-RID native lib directory (\`linux-x64/\` or \`linux-arm64/\`). Point \`OTEL_DOTNET_AUTO_HOME\` at the extracted directory.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "${{ inputs.release_tag }}" \
            --title "${{ inputs.release_tag }}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            "${args[@]}" \
            dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz
