name: release

on:
  # Tag-triggered runs are the normal path: prepare-release opens a PR, the
  # merge is auto-tagged by create-tag-for-release, and that tag lands here.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual override for hotfixes or debugging. Prefer the tag flow.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref (branch, tag, or SHA) of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        default: dash0-main
      release_tag:
        description: "Tag to create for this release (e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/upstream/packages

jobs:
  resolve-upstream:
    name: Resolve upstream ref
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve upstream SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag-triggered: read the pinned SHA that prepare-release committed.
            if [ ! -f .upstream-ref ]; then
              echo "::error::.upstream-ref missing from ${GITHUB_REF_NAME}. Was the tag created outside prepare-release?"
              exit 1
            fi
            sha=$(tr -d ' \t\r\n' < .upstream-ref)
            release_tag="${GITHUB_REF_NAME}"
            # RC tags publish as drafts; stable tags publish immediately.
            if [[ "${release_tag}" == *-rc.* ]]; then
              draft=true
            else
              draft=false
            fi
          else
            # workflow_dispatch: resolve the ref the caller supplied.
            sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${{ inputs.upstream_ref }}" --jq .sha)
            release_tag="${{ inputs.release_tag }}"
            draft="${{ inputs.draft }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream=${sha}, release_tag=${release_tag}, draft=${draft}"

  build-and-e2e:
    name: Build glibc tracer-homes and run E2E gate
    needs: resolve-upstream
    uses: ./.github/workflows/build-and-e2e.yml
    with:
      upstream_sha: ${{ needs.resolve-upstream.outputs.sha }}
    secrets: inherit

  build-musl:
    name: Build linux-musl-${{ matrix.arch }} tracer-home (alpine container)
    needs: resolve-upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve-upstream.outputs.sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch alpine.dockerfile
        run: |
          set -euo pipefail
          # 1. Strip the stale SHA check for dotnet-install.sh (same issue as
          #    ubuntu1604.dockerfile — Microsoft rotated the script). No-op
          #    now that dotnet-install.sh is vendored via COPY instead of
          #    curled, but harmless to keep in case that regresses.
          sed -i '/sha256sum -c/d' ./docker/alpine.dockerfile
          # Previously stripped apk exact-version pins here (e.g.
          # clang=17.0.6-r1) because Alpine 3.20's apk repos drifted past
          # them. Dropped: upstream's Dockerfile now declares those versions
          # as ARG ... =X.Y.Z-rN defaults consumed via clang21="${VAR}", and
          # the same blind regex was stripping the ARG defaults themselves,
          # leaving e.g. clang21="" and failing apk with "not a valid world
          # dependency".
          echo "--- patched alpine.dockerfile ---"
          cat ./docker/alpine.dockerfile

      - name: Build tracer-home in alpine container
        run: |
          set -euo pipefail
          docker build -t dash0-alpine-build -f ./docker/alpine.dockerfile .
          docker run -e OS_TYPE=linux-musl --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-alpine-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildTracer'

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-musl-${{ matrix.arch }}.tar.gz"
          # Debug symbols for the native profiler aren't needed at runtime
          # and are ~8x the size of the .so itself (see issue #2).
          find bin/tracer-home -name '*.so.debug' -print -delete
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-musl-${{ matrix.arch }}
          path: dash0-opentelemetry-dotnet-instrumentation-linux-musl-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [resolve-upstream, build-and-e2e, build-musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download glibc x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Download glibc arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-arm64

      - name: Download musl x64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-x64

      - name: Download musl arm64 asset
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-musl-arm64

      - name: Write release notes
        env:
          SHA: ${{ needs.resolve-upstream.outputs.sha }}
        run: |
          cat > release-notes.md <<EOF
          Dash0 build of [\`${{ env.UPSTREAM_REPO }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${SHA}) at commit \`${SHA}\`.

          ## Assets

          - \`dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz\` — Linux x86_64, glibc ≥ 2.23 (native code built on Ubuntu 16.04).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz\` — Linux aarch64, glibc ≥ 2.23 (native code built on Ubuntu 16.04 arm64).
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz\` — Linux x86_64 musl (built on Alpine 3.20). For Alpine-based .NET images.
          - \`dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz\` — Linux aarch64 musl (built on Alpine 3.20). For Alpine-based .NET images.

          Each archive extracts to the upstream \`bin/tracer-home\` layout (\`net/\`, \`AdditionalDeps/\`, \`linux-<arch>/\` or \`linux-musl-<arch>/\`, plus \`instrument.sh\` and legal files). Point \`OTEL_DOTNET_AUTO_HOME\` at the extracted directory. See the [README](https://github.com/${{ github.repository }}#consuming-a-release) for setup.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-upstream.outputs.release_tag }}
          DRAFT: ${{ needs.resolve-upstream.outputs.draft }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRAFT}" = "true" ]; then
            args+=(--draft)
          fi
          # For tag-triggered runs, the tag already exists; --verify-tag makes
          # gh use it. For workflow_dispatch, --target points at the current
          # SHA and gh creates the tag.
          if [ "${{ github.event_name }}" = "push" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${args[@]}" \
            dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-x64.tar.gz \
            dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz
