  build-arm64-musl:
    name: Build linux-musl-arm64 tracer-home
    needs: [build-native-arm64-musl, build-managed]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
      - name: Download managed tracer-home artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: managed-tracer-home
          path: bin/tracer-home

      - name: Download native musl arm64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-musl-arm64
          path: native-arm64-musl

      - name: Add native library to tracer-home
        run: |
          set -euo pipefail
          src="native-arm64-musl/OpenTelemetry.AutoInstrumentation.Native.so"
          dst_dir="./bin/tracer-home/linux-musl-arm64"
          dst="${dst_dir}/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
