name: build-and-e2e

# Reusable workflow: builds the glibc x64 and arm64 tracer-homes for a given
# upstream commit and runs the E2E suite against each (release-gate mode
# from test/e2e/README.md). Shared by release.yml (building the SHA pinned
# by prepare-release, gating the actual publish) and pr-validation.yml
# (building the SHA currently pinned in .upstream-ref, on every PR) so the
# build+test logic has one definition instead of two drifting copies.
#
# Only glibc is covered here -- the E2E scenarios don't exercise anything
# libc-flavor-specific, so musl tracer-homes (built separately in
# release.yml's own build-musl job) aren't gated by this workflow.
on:
  workflow_call:
    inputs:
      upstream_sha:
        description: "Commit SHA of dash0hq/opentelemetry-dotnet-instrumentation to build"
        required: true
        type: string
    secrets:
      REPOSITORY_FULL_ACCESS_GITHUB_TOKEN:
        required: false

env:
  UPSTREAM_REPO: dash0hq/opentelemetry-dotnet-instrumentation
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/upstream/packages

jobs:
  build-native-x64:
    name: Build native x64 (ubuntu 16.04 container)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch ubuntu1604.dockerfile
        run: |
          set -euo pipefail
          # 1. Strip the stale SHA check for dotnet-install.sh — upstream pins
          #    a SHA that no longer matches Microsoft's current script. TLS
          #    from dot.net covers transport integrity.
          sed -i '/sha256sum -c/d' ./docker/ubuntu1604.dockerfile
          # 2. Fix the kitware cmake repo signed-by mismatch. The RUN writes
          #    the kitware GPG key to /etc/apt/trusted.gpg.d/kitware.gpg but
          #    the sources.list restricts trust to a non-existent
          #    /usr/share/keyrings/kitware-archive-keyring.gpg. Result: apt
          #    can't verify the kitware repo, silently keeps Ubuntu 16.04's
          #    cmake 3.5.1, and the tracer's CMakeLists (requires >=3.10)
          #    fails. Switch that restriction to [trusted=yes]; the key is
          #    already trusted globally via /etc/apt/trusted.gpg.d/.
          sed -i 's|signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg|trusted=yes|' ./docker/ubuntu1604.dockerfile
          # 3. Refresh CA bundle. Xenial's ca-certificates is too old to
          #    trust some modern TLS certs; keep this so all HTTPS-using
          #    RUNs (kitware, dot.net, etc.) have a modern trust store.
          curl -fsSL https://curl.se/ca/cacert.pem -o ./docker/cacert.pem
          sed -i 's|    libicu-dev$|    libicu-dev\n\n# CA-bundle refresh (workflow patch)\nCOPY docker/cacert.pem /etc/ssl/certs/ca-certificates.crt|' ./docker/ubuntu1604.dockerfile
          # 4. Bypass the ubuntu-toolchain-r keyring fetch. Upstream now
          #    fetches the signing key from keyserver.ubuntu.com before
          #    writing the sources.list entry -- an extra network
          #    round-trip that's intermittently flaky from GitHub-Actions
          #    IP ranges (observed: sporadic 500s). Drop the curl|gpg RUN
          #    entirely and switch the sources.list entry to [trusted=yes],
          #    same fix already applied to kitware's repo above. (Older
          #    upstream Dockerfiles used `add-apt-repository
          #    ppa:ubuntu-toolchain-r/test` instead, calling
          #    api.launchpad.net directly -- if that line ever comes back,
          #    it needs this same bypass under its own name.)
          sed -i '/keyserver\.ubuntu\.com\/pks\/lookup/d' ./docker/ubuntu1604.dockerfile
          sed -i "s|^    echo 'deb \[signed-by=/usr/share/keyrings/ubuntu-toolchain-r-archive-keyring\.gpg\]|RUN echo 'deb [trusted=yes]|" ./docker/ubuntu1604.dockerfile
          # 4. Override cmake with a modern static build from Kitware's GitHub
          #    releases. Xenial ships cmake 3.5.1; the kitware apt repo for
          #    xenial no longer publishes a newer cmake, so upstream's
          #    kitware-apt install silently keeps 3.5.1 — below the tracer's
          #    cmake >= 3.10 requirement. Extract the static tarball into
          #    /usr/local and symlink into /usr/bin so Nuke (which calls
          #    /usr/bin/cmake explicitly) picks it up.
          awk '/^    apt-get install -y --allow-unauthenticated cmake$/ {
            print
            print ""
            print "# Override cmake with static Linux build from Kitware GitHub (workflow patch)"
            print "RUN curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.29.9/cmake-3.29.9-linux-x86_64.tar.gz \\"
            print "    | tar -xz -C /usr/local --strip-components=1 \\"
            print "    && ln -sf /usr/local/bin/cmake /usr/bin/cmake \\"
            print "    && cmake --version"
            next
          }
          { print }' ./docker/ubuntu1604.dockerfile > ./docker/ubuntu1604.dockerfile.patched
          mv ./docker/ubuntu1604.dockerfile.patched ./docker/ubuntu1604.dockerfile
          # 5. Replace the clang install. Upstream's own RUN pulls clang-5.0
          #    from apt.llvm.org's xenial repo, which has repeatedly failed
          #    to connect from GitHub-Actions IP ranges (both the GPG key
          #    fetch and the .deb downloads themselves) -- the archive
          #    itself is reachable from other networks, so this looks like
          #    flakiness specific to GitHub's runner egress rather than a
          #    removed/broken package. Install LLVM 8.0.1's prebuilt
          #    x86_64 tarball from GitHub releases instead, same fix
          #    already applied to the arm64 native build below (which
          #    can't use apt.llvm.org at all, since that repo has no arm64
          #    packages).
          #
          #    LLVM 8's clang binary requires GLIBCXX_3.4.22 (from GCC 5.3+
          #    libstdc++), which Ubuntu 16.04's default libstdc++ predates.
          #    The dockerfile installs g++-9 from ubuntu-toolchain-r/test,
          #    which pulls a newer libstdc++6 satisfying that requirement,
          #    so LLVM is installed AFTER the g++-9 block, not before.
          sed -i '/^# Install newer clang$/,/update-alternatives --config clang++$/d' ./docker/ubuntu1604.dockerfile
          awk '/update-alternatives --install \/usr\/bin\/gcc gcc \/usr\/bin\/gcc-9/ {
            print
            print ""
            print "# Install clang from LLVM GitHub releases (workflow patch)"
            print "RUN mkdir -p /opt/llvm \\"
            print "    && curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-8.0.1/clang+llvm-8.0.1-x86_64-linux-gnu-ubuntu-14.04.tar.xz \\"
            print "    | tar -xJ -C /opt/llvm --strip-components=1 \\"
            print "    && ln -sf /opt/llvm/bin/clang /usr/bin/clang \\"
            print "    && ln -sf /opt/llvm/bin/clang++ /usr/bin/clang++ \\"
            print "    && clang --version"
            next
          }
          { print }' ./docker/ubuntu1604.dockerfile > ./docker/ubuntu1604.dockerfile.patched
          mv ./docker/ubuntu1604.dockerfile.patched ./docker/ubuntu1604.dockerfile
          echo "--- patched ubuntu1604.dockerfile ---"
          cat ./docker/ubuntu1604.dockerfile

      - name: Build native library in Ubuntu 16.04 container
        run: |
          set -euo pipefail
          docker build -t dash0-native-build -f ./docker/ubuntu1604.dockerfile .
          # This container only has .NET SDK 9.0.316 installed, and its
          # ancient glibc cannot run .NET 10 at all. A repo-root global.json
          # (once the checked-out commit has one) pins the SDK to 10.0.302
          # for other build paths; global.json has no MSBuild-style
          # conditions, so drop it for this one container-only step instead
          # of letting dotnet try to fetch and run an incompatible SDK
          # (mirrors build-ubuntu1604-native-container.yml's own "rm -f
          # global.json" step upstream, and scripts/build-tracer-home-linux-*.sh
          # here). Restored afterward for hygiene, though this job doesn't
          # use global.json again.
          rm -f global.json
          docker run -e OS_TYPE=linux-glibc --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-native-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildNativeWorkflow'
          git checkout -- global.json 2>/dev/null || true

      - name: Upload native x64 artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-linux-x64
          path: bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so
          if-no-files-found: error
          retention-days: 7

  build-x64:
    name: Build linux-x64 tracer-home
    needs: build-native-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Pin the SDK ./build.sh runs under
        # The checked-out commit (from .upstream-ref) has no global.json, so
        # without a pin `dotnet` resolves to the highest SDK it finds on the
        # runner. build/_build.csproj and
        # tools/DependencyListGenerator/DependencyListGenerator.csproj both
        # target net10.0 (falling back to net9.0 only when the MSBuild
        # property IsLegacyUbuntu is set -- which is for the Ubuntu 16.04
        # native-build container, not this runner), so the build driver
        # itself genuinely needs some .NET 10 SDK to run.
        #
        # It can't be just any .NET 10 SDK, though: 10.0.400 specifically
        # throws Microsoft.Build.Exceptions.InvalidProjectFileException
        # ("Could not load file or assembly 'NuGet.Frameworks, Version=
        # 7.9.0.0' ... manifest definition does not match") from Nuke's
        # in-process ProjectModelTasks.ParseProject call (TransientDepen-
        # denciesGenerator) -- confirmed to reproduce identically whether
        # 10.0.400 is the runner's ambient preinstalled SDK or one freshly
        # installed by actions/setup-dotnet just below, so this is a
        # version-specific SDK/Nuke incompatibility, not an install-
        # provenance issue. Pinned to 10.0.100 (the first stable 10.0
        # release, GA 2025-11-11) with rollForward: disable to force
        # exactly that feature band instead of rolling forward into 10.0.400
        # again.
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "disable"
            }
          }
          EOF

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200
            10.0.100

      - name: Build tracer-home
        # Skip the standalone Restore target; it restores the whole solution,
        # including test-applications that pin NServiceBus 9.2.6 (net8-only),
        # which fails on the multi-TFM restore. BuildTracer restores only the
        # projects it depends on.
        run: ./build.sh BuildTracer

      - name: Download native x64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-x64
          path: native-x64

      - name: Swap in ubuntu-16.04-built native library
        run: |
          set -euo pipefail
          src="native-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          dst="./bin/tracer-home/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
          test -f "$dst"
          rm "$dst"
          cp "$src" "$dst"
          file "$dst"

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz"
          # Debug symbols for the native profiler aren't needed at runtime
          # and are ~8x the size of the .so itself (see issue #2).
          find bin/tracer-home -name '*.so.debug' -print -delete
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-x64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-native-arm64:
    name: Build native arm64 (ubuntu 16.04 container)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Patch ubuntu1604.dockerfile for arm64
        run: |
          set -euo pipefail
          # Same patches as the x64 native build (including the clang
          # install replacement -- see its comment below for why), plus two
          # arm64-specific adjustments: switch the base to
          # arm64v8/ubuntu:16.04 (the pinned amd64 digest does not resolve
          # on an arm64 host), and use the aarch64 cmake tarball.

          # Base image: arm64 variant (drop the amd64 digest pin)
          sed -i 's|^FROM ubuntu:16.04@sha256:[0-9a-f]*|FROM arm64v8/ubuntu:16.04|' ./docker/ubuntu1604.dockerfile

          # Stale dotnet-install.sh SHA
          sed -i '/sha256sum -c/d' ./docker/ubuntu1604.dockerfile

          # kitware signed-by → trusted=yes (kitware apt install is vestigial
          # after the tarball override below, but keep the fix so apt-get
          # update doesn't emit a hard error)
          sed -i 's|signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg|trusted=yes|' ./docker/ubuntu1604.dockerfile

          # CA-bundle refresh
          curl -fsSL https://curl.se/ca/cacert.pem -o ./docker/cacert.pem
          sed -i 's|    libicu-dev$|    libicu-dev\n\n# CA-bundle refresh (workflow patch)\nCOPY docker/cacert.pem /etc/ssl/certs/ca-certificates.crt|' ./docker/ubuntu1604.dockerfile

          # Bypass the ubuntu-toolchain-r keyring fetch — upstream now
          # fetches the signing key from keyserver.ubuntu.com before
          # writing the sources.list entry, an extra network round-trip
          # that's intermittently flaky from GitHub-Actions IP ranges
          # (observed: sporadic 500s). Drop the curl|gpg RUN entirely and
          # switch the sources.list entry to [trusted=yes], same fix
          # already applied to kitware's repo above.
          sed -i '/keyserver\.ubuntu\.com\/pks\/lookup/d' ./docker/ubuntu1604.dockerfile
          sed -i "s|^    echo 'deb \[signed-by=/usr/share/keyrings/ubuntu-toolchain-r-archive-keyring\.gpg\]|RUN echo 'deb [trusted=yes]|" ./docker/ubuntu1604.dockerfile

          # Replace the clang install. apt.llvm.org/xenial has no arm64
          # packages, and Ubuntu 16.04 xenial arm64 only ships clang <= 3.9
          # (insufficient for the tracer's -std=c++17). Install LLVM 8.0.1's
          # prebuilt aarch64 tarball instead. The tracer's CMakeLists
          # locates clang/clang++ via find_program and uses them as
          # CMAKE_C_COMPILER / CMAKE_CXX_COMPILER.
          #
          # LLVM 8's clang binary requires GLIBCXX_3.4.22 (from GCC 5.3+
          # libstdc++), which Ubuntu 16.04's default libstdc++ predates.
          # The dockerfile installs g++-9 from ubuntu-toolchain-r/test,
          # which pulls a newer libstdc++6 satisfying that requirement, so
          # LLVM is installed AFTER the g++-9 block, not before.
          sed -i '/^# Install newer clang$/,/update-alternatives --config clang++$/d' ./docker/ubuntu1604.dockerfile
          awk '/update-alternatives --install \/usr\/bin\/gcc gcc \/usr\/bin\/gcc-9/ {
            print
            print ""
            print "# Install clang from LLVM GitHub releases (workflow patch for arm64)"
            print "RUN mkdir -p /opt/llvm \\"
            print "    && curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-8.0.1/clang+llvm-8.0.1-aarch64-linux-gnu.tar.xz \\"
            print "    | tar -xJ -C /opt/llvm --strip-components=1 \\"
            print "    && ln -sf /opt/llvm/bin/clang /usr/bin/clang \\"
            print "    && ln -sf /opt/llvm/bin/clang++ /usr/bin/clang++ \\"
            print "    && clang --version"
            next
          }
          { print }' ./docker/ubuntu1604.dockerfile > ./docker/ubuntu1604.dockerfile.patched
          mv ./docker/ubuntu1604.dockerfile.patched ./docker/ubuntu1604.dockerfile

          # cmake arch fix — the base dockerfile's cmake install RUN block
          # hardcodes the x86_64 installer regardless of target arch. On the
          # arm64 build that silently installs an x86_64 cmake binary into
          # /usr/local/bin, which then fails at runtime with "Exec format
          # error". Swap the installer filename for the aarch64 build. (Its
          # sha256sum check line is already stripped above, along with the
          # dotnet-install.sh one, since both match /sha256sum -c/.)
          sed -i 's|cmake-${CMAKE_VERSION}-linux-x86_64.sh|cmake-${CMAKE_VERSION}-linux-aarch64.sh|' ./docker/ubuntu1604.dockerfile
          echo "--- patched ubuntu1604.dockerfile (arm64) ---"
          cat ./docker/ubuntu1604.dockerfile

      - name: Build native library in Ubuntu 16.04 container
        run: |
          set -euo pipefail
          docker build -t dash0-native-build -f ./docker/ubuntu1604.dockerfile .
          # This container only has .NET SDK 9.0.316 installed, and its
          # ancient glibc cannot run .NET 10 at all. A repo-root global.json
          # (once the checked-out commit has one) pins the SDK to 10.0.302
          # for other build paths; global.json has no MSBuild-style
          # conditions, so drop it for this one container-only step instead
          # of letting dotnet try to fetch and run an incompatible SDK
          # (mirrors build-ubuntu1604-native-container.yml's own "rm -f
          # global.json" step upstream, and scripts/build-tracer-home-linux-*.sh
          # here). Restored afterward for hygiene, though this job doesn't
          # use global.json again.
          rm -f global.json
          docker run -e OS_TYPE=linux-glibc --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project \
            dash0-native-build \
            /bin/sh -c 'export PATH="$PATH:/usr/share/dotnet" && git config --global --add safe.directory /project && ./build.sh BuildNativeWorkflow'
          git checkout -- global.json 2>/dev/null || true

      - name: Upload native arm64 artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-linux-arm64
          path: bin/tracer-home/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    name: Build linux-arm64 tracer-home
    needs: build-native-arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_sha }}
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream release tags for MinVer
        # The dash0hq fork carries no release tags of its own (see .dash0-branch-meta.yaml — it's pinned to a raw
        # commit SHA, not a tag, pending U12). MinVer derives every assembly's version from the closest reachable
        # git tag; with none available it silently falls back to 0.0.0.0 for everything. That breaks runtime
        # assembly-version checks — e.g. OpenTelemetry.AutoInstrumentation.PluginApi.dll gets rejected at load
        # time (FileNotFoundException) because its consumers expect a real >=1.0.0 version. The real upstream repo
        # shares full history with the fork, so fetching its tags here is enough for MinVer to find one.
        run: git fetch --tags --quiet https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation.git

      - name: Pin the SDK ./build.sh runs under
        # The checked-out commit (from .upstream-ref) has no global.json, so
        # without a pin `dotnet` resolves to the highest SDK it finds on the
        # runner. build/_build.csproj and
        # tools/DependencyListGenerator/DependencyListGenerator.csproj both
        # target net10.0 (falling back to net9.0 only when the MSBuild
        # property IsLegacyUbuntu is set -- which is for the Ubuntu 16.04
        # native-build container, not this runner), so the build driver
        # itself genuinely needs some .NET 10 SDK to run.
        #
        # It can't be just any .NET 10 SDK, though: 10.0.400 specifically
        # throws Microsoft.Build.Exceptions.InvalidProjectFileException
        # ("Could not load file or assembly 'NuGet.Frameworks, Version=
        # 7.9.0.0' ... manifest definition does not match") from Nuke's
        # in-process ProjectModelTasks.ParseProject call (TransientDepen-
        # denciesGenerator) -- confirmed to reproduce identically whether
        # 10.0.400 is the runner's ambient preinstalled SDK or one freshly
        # installed by actions/setup-dotnet just below, so this is a
        # version-specific SDK/Nuke incompatibility, not an install-
        # provenance issue. Pinned to 10.0.100 (the first stable 10.0
        # release, GA 2025-11-11) with rollForward: disable to force
        # exactly that feature band instead of rolling forward into 10.0.400
        # again.
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "disable"
            }
          }
          EOF

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.406
            9.0.200
            10.0.100

      - name: Build tracer-home
        run: ./build.sh BuildTracer

      - name: Download native arm64 artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-linux-arm64
          path: native-arm64

      - name: Swap in ubuntu-16.04-built native library
        run: |
          set -euo pipefail
          src="native-arm64/OpenTelemetry.AutoInstrumentation.Native.so"
          dst="./bin/tracer-home/linux-arm64/OpenTelemetry.AutoInstrumentation.Native.so"
          test -f "$src"
          test -f "$dst"
          rm "$dst"
          cp "$src" "$dst"
          file "$dst"

      - name: Package tracer-home
        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz"
          # Debug symbols for the native profiler aren't needed at runtime
          # and are ~8x the size of the .so itself (see issue #2).
          find bin/tracer-home -name '*.so.debug' -print -delete
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-arm64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E tests (${{ matrix.arch }})
    # Release-gate mode from test/e2e/README.md: validate the exact glibc
    # tarball build-x64/build-arm64 just built, not a from-source rebuild.
    needs: [build-x64, build-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release-linux-${{ matrix.arch }} tracer-home
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-${{ matrix.arch }}

      - name: Extract tracer-home
        run: |
          set -euo pipefail
          mkdir -p tracer-home
          tar -C tracer-home -xzf "dash0-opentelemetry-dotnet-instrumentation-linux-${{ matrix.arch }}.tar.gz"
          echo "DASH0_E2E_TRACER_HOME=${GITHUB_WORKSPACE}/tracer-home" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/e2e/go.mod

      - name: Run E2E tests
        working-directory: test/e2e
        # efcore/efcorenet8 are t.Skip()-ed: a real, root-caused upstream
        # bug (see their package docs and README.md's "Known failure:
        # efcore" section), not something this run could catch or fix.
        run: go test -v ./...
