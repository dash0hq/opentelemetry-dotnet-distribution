        run: |
          set -euo pipefail
          out="dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz"
          # Debug symbols for the native profiler aren't needed at runtime
          # and are ~8x the size of the .so itself (see issue #2).
          find bin/tracer-home -name '*.so.debug' -print -delete
          ls -la bin/tracer-home
          tar -C bin/tracer-home -czf "${GITHUB_WORKSPACE}/${out}" .
          ls -lh "${GITHUB_WORKSPACE}/${out}"

      - name: Upload release asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-linux-musl-arm64
          path: dash0-opentelemetry-dotnet-instrumentation-linux-musl-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The four e2e-* jobs below are near-duplicates of each other (differing
  # only in which tarball they validate, which runner they need, and
  # DASH0_E2E_LIBC_FLAVOR), kept as separate jobs rather than one matrixed
  # job specifically. As a single matrix job, every matrix leg
  # would block on all four build-* jobs even though e.g. the x64 tarball
  # has nothing to do with the arm64-musl build. That false dependency would
  # delay, say, the x64 E2E run until the slowest of all four build tracks
  # finishes, instead of starting the moment build-x64 itself is ready.
  #
  # Each of the four DOES matrix internally on dotnet-version.

  e2e-x64:
    name: "E2E tests (x64, ${{ matrix.dotnet-version }})"
    # Release-gate mode from test/e2e/README.md: validate the exact glibc
    # tarball build-x64 just built, not a from-source rebuild.
    needs: build-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One leg per .NET version the e2e suite covers (see README.md's
        # Scenarios table). The `go test -run` pattern below matches every
        # package's subtest for this leg's version, so a new
        # version-swept scenario is picked up automatically -- no list to
        # update here. Scenarios with no version subtest of their own
        # (aspnetcorenet6, efcorenet6, runtimemetrics) gate on LEG_VERSION
        # themselves so they only actually run on the "6.0" leg, instead of
        # once per leg.
        dotnet-version: ["6.0", "7.0", "8.0", "9.0", "10.0"]
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release-linux-x64 tracer-home
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-linux-x64

      - name: Extract tracer-home
        run: |
          set -euo pipefail
          mkdir -p tracer-home
          tar -C tracer-home -xzf dash0-opentelemetry-dotnet-instrumentation-linux-x64.tar.gz
          echo "DASH0_E2E_TRACER_HOME=${GITHUB_WORKSPACE}/tracer-home" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/e2e/go.mod

      - name: Run E2E tests
        working-directory: test/e2e
        # efcore/efcorenet8 are t.Skip()-ed: a real, root-caused upstream
        # bug (see their package docs and README.md's "Known failure:
        # efcore" section), not something this run could catch or fix.
        env:
          LEG_VERSION: ${{ matrix.dotnet-version }}
        run: |
