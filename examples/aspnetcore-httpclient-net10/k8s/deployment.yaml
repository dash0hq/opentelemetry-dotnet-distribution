apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspnetcore-httpclient-net10
  namespace: dash0-dotnet-examples
  labels:
    app: aspnetcore-httpclient-net10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspnetcore-httpclient-net10
  template:
    metadata:
      labels:
        app: aspnetcore-httpclient-net10
    spec:
      containers:
        - name: aspnetcore-httpclient-net10
          image: localhost:5001/dash0-dotnet-example-aspnetcore-httpclient-net10:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aspnetcore-httpclient-net10
  namespace: dash0-dotnet-examples
spec:
  selector:
    app: aspnetcore-httpclient-net10
  ports:
    - port: 8080
      targetPort: 8080
