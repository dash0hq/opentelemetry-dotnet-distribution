apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspnetcore-httpclient
  namespace: dash0-dotnet-examples
  labels:
    app: aspnetcore-httpclient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspnetcore-httpclient
  template:
    metadata:
      labels:
        app: aspnetcore-httpclient
    spec:
      containers:
        - name: aspnetcore-httpclient
          image: localhost:5001/dash0-dotnet-example-aspnetcore-httpclient:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aspnetcore-httpclient
  namespace: dash0-dotnet-examples
spec:
  selector:
    app: aspnetcore-httpclient
  ports:
    - port: 8080
      targetPort: 8080
