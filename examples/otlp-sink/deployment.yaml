apiVersion: v1
kind: Namespace
metadata:
  name: otlp-sink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-sink
  namespace: otlp-sink
  labels:
    app: otlp-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otlp-sink
  template:
    metadata:
      labels:
        app: otlp-sink
    spec:
      containers:
        - name: otlp-sink
          image: otel/opentelemetry-collector:0.111.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otlp-sink-config
---
apiVersion: v1
kind: Service
metadata:
  name: otlp-sink
  namespace: otlp-sink
spec:
  selector:
    app: otlp-sink
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
