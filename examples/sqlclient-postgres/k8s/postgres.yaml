apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dash0-dotnet-examples
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        # Opts this backing service out of Dash0 auto-instrumentation (see dash0.com/enable in the operator's
        # Dash0Monitoring CRD docs). It's plain infrastructure, not one of the .NET runtimes under test.
        dash0.com/enable: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dash0-dotnet-examples
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
