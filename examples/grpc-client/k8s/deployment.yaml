apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
  namespace: dash0-dotnet-examples
  labels:
    app: grpc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-client
  template:
    metadata:
      labels:
        app: grpc-client
    spec:
      containers:
        - name: grpc-client
          image: localhost:5001/dash0-dotnet-example-grpc-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-client
  namespace: dash0-dotnet-examples
spec:
  selector:
    app: grpc-client
  ports:
    - port: 8080
      targetPort: 8080
