apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: dash0-dotnet-examples
  labels:
    app: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis-cache
          image: localhost:5001/dash0-dotnet-example-redis-cache:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_CONNECTION_STRING
              value: "redis:6379"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: dash0-dotnet-examples
spec:
  selector:
    app: redis-cache
  ports:
    - port: 8080
      targetPort: 8080
