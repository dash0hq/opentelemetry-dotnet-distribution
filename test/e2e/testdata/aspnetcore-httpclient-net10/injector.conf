# SPDX-License-Identifier: Apache-2.0
# Points the OTel injector at the tracer-home staged into this image by the
# E2E harness. Mirrors the dotnet_* keys dash0-operator's own injector.conf
# sets, minus the other-language keys this dotnet-only scenario doesn't need.
dotnet_auto_instrumentation_agent_path_prefix=/dash0-instrumentation/dotnet
dotnet_auto_instrumentation_minimum_dotnet_major_version=6
